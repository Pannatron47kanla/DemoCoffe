openapi: 3.1.0
info:
  title: DemoCoffe Kiosk API
  version: 0.1.0
  description: |
    เฟส 1 MVP — ตู้เดี่ยว 1 สาขา ไม่มีคีย์ตู้ (api รับเฉพาะ 127.0.0.1)
    เงินทุกจุดเป็น `Money` (บาท ทศนิยม 2 ตำแหน่งเป็นข้อความ) ระบบคิดราคาเอง ไม่รับราคาจากตู้
security: []   # เฟส 1 ไม่มีคีย์ตู้ (api bind 127.0.0.1)
servers:
  - url: http://127.0.0.1:3000
tags:
  - name: ordering
    description: UC-01 สั่งเครื่องดื่มที่ตู้
  - name: voice
    description: UC-02 ยินยอมและเริ่มสั่งด้วยเสียง, UC-03 สั่งด้วยเสียง

paths:
  /carts:
    post:
      tags: [ordering]
      operationId: startCart
      summary: เริ่มสั่ง สร้างตะกร้าว่าง (AC1)
      responses:
        '201':
          description: ตะกร้าว่าง
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
              example:
                id: 7d0f1a52-4b8e-4c1e-9a77-2f1d3c4b5a60
                status: OPEN
                expiresAt: '2026-10-19T02:45:00Z'
                lines: []
                totalCups: 0
                total: { amount: '0.00', currency: THB }
        '500': { $ref: '#/components/responses/InternalError' }

  /carts/{cartId}:
    parameters:
      - $ref: '#/components/parameters/CartId'
    get:
      tags: [ordering]
      operationId: getCart
      summary: ดูตะกร้า
      responses:
        '200':
          description: ตะกร้าล่าสุด
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
              examples: { CartWithLatte: { $ref: '#/components/examples/CartWithLatte' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /carts/{cartId}/lines:
    parameters:
      - $ref: '#/components/parameters/CartId'
    post:
      tags: [ordering]
      operationId: addCartLine
      summary: เพิ่มรายการ ถ้าเมนูและตัวเลือกชุดเดียวกันมีอยู่แล้วจะรวมจำนวน (AC2, AC3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartLineRequest' }
            example:
              menuItemId: latte
              optionChoiceIds: [size-l, milk-oat]
              quantity: 2
      responses:
        '200':
          description: ตะกร้าหลังเพิ่มรายการ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
              examples:
                CartWithLatte: { $ref: '#/components/examples/CartWithLatte' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CartRuleViolation' }
        '500': { $ref: '#/components/responses/InternalError' }

  /carts/{cartId}/lines/{lineId}:
    parameters:
      - $ref: '#/components/parameters/CartId'
      - $ref: '#/components/parameters/LineId'
    patch:
      tags: [ordering]
      operationId: changeCartLineQuantity
      summary: แก้จำนวน (AC4)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeQuantityRequest' }
            example: { quantity: 4 }
      responses:
        '200':
          description: ตะกร้าหลังแก้จำนวน
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
              examples: { CartWithLatte: { $ref: '#/components/examples/CartWithLatte' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CartRuleViolation' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [ordering]
      operationId: removeCartLine
      summary: ลบรายการ (AC5)
      responses:
        '200':
          description: ตะกร้าหลังลบรายการ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
              example:
                id: 7d0f1a52-4b8e-4c1e-9a77-2f1d3c4b5a60
                status: OPEN
                expiresAt: '2026-10-19T02:47:00Z'
                lines: []
                totalCups: 0
                total: { amount: '0.00', currency: THB }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CartRuleViolation' }
        '500': { $ref: '#/components/responses/InternalError' }

  /carts/{cartId}/checkout:
    parameters:
      - $ref: '#/components/parameters/CartId'
    post:
      tags: [ordering]
      operationId: checkoutCart
      summary: ยืนยันออเดอร์และรับหมายเลขคิว (AC15–AC25)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: key เดิมกับตะกร้าเดิมคืนออเดอร์เดิม (AC18) ใช้กับตะกร้าอื่นไม่ได้ (AC25)
          schema: { type: string, minLength: 1, maxLength: 100 }
          example: k-123
      responses:
        '201':
          description: สร้างออเดอร์ใหม่
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              examples: { PlacedOrder: { $ref: '#/components/examples/PlacedOrder' } }
        '200':
          description: ยืนยันซ้ำด้วย key เดิม คืนออเดอร์เดิม (AC18)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              examples: { PlacedOrder: { $ref: '#/components/examples/PlacedOrder' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CheckoutRuleViolation' }
        '500': { $ref: '#/components/responses/InternalError' }

  /voice/consent-text:
    get:
      tags: [voice]
      operationId: getVoiceConsentText
      summary: ข้อความยินยอมเรื่องเสียงเวอร์ชันปัจจุบัน (AC1, AC10, AC15)
      responses:
        '200':
          description: ข้อความยินยอมปัจจุบัน อ่านจาก data/voice-consent.json
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceConsentText' }
              examples: { DemoConsentText: { $ref: '#/components/examples/DemoConsentText' } }
        '503': { $ref: '#/components/responses/VoiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /voice/sessions:
    post:
      tags: [voice]
      operationId: startVoiceSession
      summary: ยินยอมและรับข้อมูลเชื่อมต่อเสียง (AC2–AC13)
      description: |
        ตะกร้าที่ยังไม่มีเซสชันเสียง → บันทึกความยินยอมแล้วตอบ 201 (AC2)
        ตะกร้าที่มีเซสชันแล้ว → ตอบ 200 เซสชันเดิมพร้อมข้อมูลเชื่อมต่อใหม่ ไม่บันทึกเพิ่ม (AC4, AC13)
        บันทึกความยินยอมก่อนขอโทเคน ถ้าขอโทเคนไม่สำเร็จตอบ 503 แต่บันทึกยังอยู่ (AC11)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartVoiceSessionRequest' }
            example:
              cartId: 7d0f1a52-4b8e-4c1e-9a77-2f1d3c4b5a60
              consentTextVersion: voice-demo-v1
      responses:
        '201':
          description: ยินยอมครั้งแรกของตะกร้านี้ สร้างเซสชันเสียง (AC2)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceSession' }
              examples: { NewVoiceSession: { $ref: '#/components/examples/NewVoiceSession' } }
        '200':
          description: ตะกร้านี้มีเซสชันแล้ว คืนเซสชันเดิมพร้อมข้อมูลเชื่อมต่อใหม่ (AC4)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceSession' }
              examples: { NewVoiceSession: { $ref: '#/components/examples/NewVoiceSession' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VoiceRuleViolation' }
        '503': { $ref: '#/components/responses/VoiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /voice/sessions/{sessionId}/function-calls:
    parameters:
      - $ref: '#/components/parameters/VoiceSessionId'
    post:
      tags: [voice]
      operationId: callVoiceFunction
      summary: ส่งต่อ function call จาก Gemini ให้เซิร์ฟเวอร์ทำกับตะกร้าของเซสชัน (UC-03 AC3–AC18)
      description: |
        ตู้ส่ง function call ของ Gemini มาตรงๆ ไม่ตีความเอง ตะกร้ามาจากเซสชันเสียงเท่านั้น (R2)
        ทุกฟังก์ชันผ่านกฎ UC-01 ชุดเดียวกับการแตะจอ ผิดกฎตอบ status และ code เดียวกับ UC-01 (R7)
        ตู้ส่ง body ของ 200/400/404/409 กลับให้ Gemini เป็น function response; 503/500 ให้ปิดเสียงแล้วกลับไปแตะจอ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoiceFunctionCall' }
            examples:
              AddToCart:
                value: { name: add_to_cart, args: { menuItemId: latte, optionChoiceIds: [size-l, milk-oat], quantity: 2 } }
              ChangeQuantity:
                value: { name: change_quantity, args: { lineId: 3b9c2e10-8f4a-4d6b-b1c2-0e9f8a7d6c51, quantity: 4 } }
              RemoveFromCart:
                value: { name: remove_from_cart, args: { lineId: 3b9c2e10-8f4a-4d6b-b1c2-0e9f8a7d6c51 } }
              ViewCart:
                value: { name: view_cart, args: {} }
              RequestCheckout:
                value: { name: request_checkout, args: {} }
      responses:
        '200':
          description: ทำสำเร็จ คืนตะกร้าล่าสุด และสิ่งที่ตู้ต้องแสดง
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceFunctionResult' }
              examples:
                CartUpdated:
                  summary: add_to_cart / change_quantity / remove_from_cart / view_cart (AC3–AC6)
                  value:
                    action: SHOW_CART
                    cart:
                      id: 7d0f1a52-4b8e-4c1e-9a77-2f1d3c4b5a60
                      status: OPEN
                      expiresAt: '2026-10-20T02:46:00Z'
                      lines:
                        - id: 3b9c2e10-8f4a-4d6b-b1c2-0e9f8a7d6c51
                          menuItemId: latte
                          name: ลาเต้
                          options:
                            - { choiceId: size-l, groupName: ขนาด, name: L, priceDelta: { amount: '10.00', currency: THB } }
                            - { choiceId: milk-oat, groupName: นม, name: นมโอ๊ต, priceDelta: { amount: '15.00', currency: THB } }
                          quantity: 2
                          unitPrice: { amount: '80.00', currency: THB }
                          lineTotal: { amount: '160.00', currency: THB }
                      totalCups: 2
                      total: { amount: '160.00', currency: THB }
                ShowCheckout:
                  summary: request_checkout ตะกร้ายัง OPEN ไม่มีออเดอร์ (AC7)
                  value:
                    action: SHOW_CHECKOUT
                    cart:
                      id: 7d0f1a52-4b8e-4c1e-9a77-2f1d3c4b5a60
                      status: OPEN
                      expiresAt: '2026-10-20T02:46:00Z'
                      lines:
                        - id: 3b9c2e10-8f4a-4d6b-b1c2-0e9f8a7d6c51
                          menuItemId: latte
                          name: ลาเต้
                          options:
                            - { choiceId: size-l, groupName: ขนาด, name: L, priceDelta: { amount: '10.00', currency: THB } }
                            - { choiceId: milk-oat, groupName: นม, name: นมโอ๊ต, priceDelta: { amount: '15.00', currency: THB } }
                          quantity: 2
                          unitPrice: { amount: '80.00', currency: THB }
                          lineTotal: { amount: '160.00', currency: THB }
                      totalCups: 2
                      total: { amount: '160.00', currency: THB }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/VoiceCallNotFound' }
        '409': { $ref: '#/components/responses/VoiceCallRuleViolation' }
        '503': { $ref: '#/components/responses/VoiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  parameters:
    CartId:
      name: cartId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 7d0f1a52-4b8e-4c1e-9a77-2f1d3c4b5a60
    LineId:
      name: lineId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 3b9c2e10-8f4a-4d6b-b1c2-0e9f8a7d6c51

    VoiceSessionId:
      name: sessionId
      in: path
      required: true
      description: id ของเซสชันเสียงจาก POST /voice/sessions
      schema: { type: string, format: uuid }
      example: 5e1d7c3a-2b4f-4a6e-9c8d-1f0e2d3c4b5a

  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^\d+\.\d{2}$', example: '80.00' }
        currency: { type: string, enum: [THB], example: THB }

    ChosenOption:
      type: object
      required: [choiceId, groupName, name, priceDelta]
      properties:
        choiceId: { type: string, example: size-l }
        groupName: { type: string, example: ขนาด }
        name: { type: string, example: L }
        priceDelta: { $ref: '#/components/schemas/Money' }

    CartLine:
      type: object
      required: [id, menuItemId, name, options, quantity, unitPrice, lineTotal]
      properties:
        id: { type: string, format: uuid, example: 3b9c2e10-8f4a-4d6b-b1c2-0e9f8a7d6c51 }
        menuItemId: { type: string, example: latte }
        name: { type: string, example: ลาเต้ }
        options:
          type: array
          items: { $ref: '#/components/schemas/ChosenOption' }
        quantity: { type: integer, example: 2 }
        unitPrice: { $ref: '#/components/schemas/Money' }
        lineTotal: { $ref: '#/components/schemas/Money' }

    Cart:
      type: object
      required: [id, status, expiresAt, lines, totalCups, total]
      properties:
        id: { type: string, format: uuid, example: 7d0f1a52-4b8e-4c1e-9a77-2f1d3c4b5a60 }
        status: { type: string, enum: [OPEN, CHECKED_OUT], example: OPEN }
        expiresAt:
          type: string
          format: date-time
          description: หมดอายุเมื่อไม่มีการแก้ไข 15 นาที (R7)
          example: '2026-10-19T02:45:00Z'
        lines:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
        totalCups: { type: integer, description: ไม่เกิน 20 (R5), example: 2 }
        total: { $ref: '#/components/schemas/Money' }

    AddCartLineRequest:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId: { type: string, minLength: 1, example: latte }
        optionChoiceIds:
          type: array
          items: { type: string }
          default: []
          example: [size-l, milk-oat]
        quantity:
          type: integer
          description: 1–10 (R4) นอกช่วงตอบ 409 QUANTITY_OUT_OF_RANGE ไม่ใช่ 400
          example: 2

    ChangeQuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          description: 1–10 (R4) นอกช่วงตอบ 409 QUANTITY_OUT_OF_RANGE
          example: 4

    OrderLine:
      type: object
      required: [menuItemId, name, options, quantity, unitPrice, lineTotal]
      properties:
        menuItemId: { type: string, example: latte }
        name: { type: string, description: ชื่อ ณ ตอนยืนยัน (AC24), example: ลาเต้ }
        options:
          type: array
          items: { $ref: '#/components/schemas/ChosenOption' }
        quantity: { type: integer, example: 2 }
        unitPrice: { $ref: '#/components/schemas/Money' }
        lineTotal: { $ref: '#/components/schemas/Money' }

    Order:
      type: object
      required: [id, cartId, status, queueNumber, placedAt, lines, total]
      properties:
        id: { type: string, format: uuid, example: 0c6a4f2e-9d1b-4e3a-8f5c-6b7a8d9e0f12 }
        cartId: { type: string, format: uuid, example: 7d0f1a52-4b8e-4c1e-9a77-2f1d3c4b5a60 }
        status: { type: string, enum: [PLACED], example: PLACED }
        queueNumber:
          type: integer
          minimum: 1
          description: เรียงต่อวันทำการ Asia/Bangkok เริ่มที่ 1 (R10)
          example: 1
        placedAt: { type: string, format: date-time, example: '2026-10-19T02:30:00Z' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        total: { $ref: '#/components/schemas/Money' }

    VoiceConsentText:
      type: object
      required: [version, text]
      properties:
        version: { type: string, example: voice-demo-v1 }
        text:
          type: string
          description: ต้องบอกว่าเสียงส่งไป Google อาจใช้ปรับปรุงบริการ ให้คนตรวจอ่านได้ และไม่รับประกันว่าประมวลผลในสิงคโปร์ (R10)
          example: เสียงของคุณจะถูกส่งไปยัง Google เพื่อแปลงเป็นคำสั่ง Google อาจนำไปใช้ปรับปรุงบริการและให้เจ้าหน้าที่ตรวจอ่านได้ และไม่รับประกันว่าจะประมวลผลในสิงคโปร์ ระบบไม่เก็บไฟล์เสียงและไม่ผูกกับตัวคุณ

    StartVoiceSessionRequest:
      type: object
      required: [cartId, consentTextVersion]
      properties:
        cartId: { type: string, format: uuid, example: 7d0f1a52-4b8e-4c1e-9a77-2f1d3c4b5a60 }
        consentTextVersion:
          type: string
          minLength: 1
          description: เวอร์ชันข้อความที่ตู้แสดง ไม่ใช่ปัจจุบันตอบ 409 CONSENT_TEXT_OUTDATED (R2)
          example: voice-demo-v1

    VoiceConnection:
      type: object
      description: ข้อมูลชั่วคราวให้ตู้เปิด Gemini Live ตรง ใช้ได้ครั้งเดียว (R6)
      required: [token, model, startBefore]
      properties:
        token:
          type: string
          description: ephemeral token ของ Gemini ไม่ใช่ API key ถาวร (R7)
          example: auth_tokens/3f9a1c7e2b
        model: { type: string, description: รุ่นที่โทเคนล็อกไว้ (VOICE_MODEL), example: gemini-3.8-live }
        startBefore:
          type: string
          format: date-time
          description: ต้องเปิดการเชื่อมต่อก่อนเวลานี้ (1 นาที, R6)
          example: '2026-10-20T02:31:00Z'

    VoiceSession:
      type: object
      required: [id, cartId, consentTextVersion, consentedAt, connection]
      properties:
        id: { type: string, format: uuid, example: 5e1d7c3a-2b4f-4a6e-9c8d-1f0e2d3c4b5a }
        cartId: { type: string, format: uuid, example: 7d0f1a52-4b8e-4c1e-9a77-2f1d3c4b5a60 }
        consentTextVersion: { type: string, example: voice-demo-v1 }
        consentedAt: { type: string, format: date-time, example: '2026-10-20T02:30:00Z' }
        connection: { $ref: '#/components/schemas/VoiceConnection' }

    VoiceFunctionCall:
      type: object
      description: function call จาก Gemini ส่งต่อตรงๆ ชื่อและ args ต้องตรงกับฟังก์ชันที่ล็อกไว้ในโทเคน (UC-03)
      required: [name]
      properties:
        name:
          type: string
          enum: [add_to_cart, change_quantity, remove_from_cart, view_cart, request_checkout]
          example: add_to_cart
        args:
          type: object
          default: {}
          description: |
            add_to_cart → `menuItemId` (ต้องมี), `optionChoiceIds` (ไม่บังคับ), `quantity` (ต้องมี จำนวนเต็ม)
            change_quantity → `lineId`, `quantity`
            remove_from_cart → `lineId`
            view_cart, request_checkout → ไม่มี
            ผิดรูปแบบตอบ 400 VALIDATION_ERROR (AC16) ช่วงของจำนวนเป็นกฎ UC-01 ตอบ 409
          properties:
            menuItemId: { type: string, example: latte }
            optionChoiceIds:
              type: array
              items: { type: string }
              example: [size-l, milk-oat]
            quantity: { type: integer, example: 2 }
            lineId: { type: string, format: uuid, example: 3b9c2e10-8f4a-4d6b-b1c2-0e9f8a7d6c51 }
          example: { menuItemId: latte, optionChoiceIds: [size-l, milk-oat], quantity: 2 }

    VoiceFunctionResult:
      type: object
      required: [action, cart]
      properties:
        action:
          type: string
          enum: [SHOW_CART, SHOW_CHECKOUT]
          description: SHOW_CHECKOUT เมื่อเรียก request_checkout ตู้เปิดหน้าสรุปให้ลูกค้าแตะยืนยัน (R3)
          example: SHOW_CART
        cart: { $ref: '#/components/schemas/Cart' }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - MENU_ITEM_NOT_FOUND
            - CART_NOT_FOUND
            - CART_LINE_NOT_FOUND
            - MENU_ITEM_UNAVAILABLE
            - OPTION_REQUIRED
            - INVALID_OPTION
            - QUANTITY_OUT_OF_RANGE
            - CART_LIMIT_REACHED
            - CART_EXPIRED
            - CART_ALREADY_CHECKED_OUT
            - CART_EMPTY
            - PRICE_CHANGED
            - IDEMPOTENCY_KEY_CONFLICT
            - CONSENT_TEXT_OUTDATED
            - VOICE_UNAVAILABLE
            - VOICE_SESSION_NOT_FOUND
            - INTERNAL_ERROR
          example: CART_LIMIT_REACHED
        message: { type: string, example: ตะกร้ามีได้ไม่เกิน 20 แก้ว }
        details:
          type: object
          description: |
            MENU_ITEM_UNAVAILABLE ตอนยืนยัน → `lineIds` (AC21)
            PRICE_CHANGED → `cart` ที่คิดราคาใหม่แล้ว (AC22)
            VALIDATION_ERROR → `fields`
            CONSENT_TEXT_OUTDATED → `currentVersion` (AC9)
            OPTION_REQUIRED → `groupId` (UC-03 AC9)
          properties:
            lineIds:
              type: array
              items: { type: string, format: uuid }
              example: [3b9c2e10-8f4a-4d6b-b1c2-0e9f8a7d6c51]
            cart: { $ref: '#/components/schemas/Cart' }
            fields:
              type: array
              items: { type: string }
              example: [menuItemId]
            currentVersion: { type: string, example: voice-demo-v2 }
            groupId: { type: string, example: size }

